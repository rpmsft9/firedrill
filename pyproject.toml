[project]
name = "firedrill"
version = "0.1.0"
description = "Detection validation for AI agents: replay attack traces against your detection rules and measure coverage by OWASP Agentic Top 10 and MITRE ATLAS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Raj Penchala" }]
keywords = ["detection-engineering", "ai-security", "agentic", "sigma", "opentelemetry", "owasp", "mitre-atlas", "purple-team"]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
firedrill = "firedrill.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firedrill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
