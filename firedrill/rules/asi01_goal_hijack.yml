title: Injected instructions in a tool result followed by external egress
id: 6f0c8a1e-3b5d-4c0a-9a41-0d1f5e7b2a02
name: fd_injection_then_egress
status: experimental
description: >
  A tool returned content containing instruction-override language and the
  same conversation then sent data outside the organisation.
correlation:
  type: temporal_ordered
  rules:
    - fd_base_injection_marker
    - fd_base_external_egress
  group-by:
    - gen_ai.conversation.id
  timespan: 5m
level: high
tags:
  - owasp-asi.asi01
  - atlas.aml.t0051.001
  - atlas.aml.t0086
