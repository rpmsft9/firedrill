title: Model output embeds a markdown image with a data-bearing URL
id: 6f0c8a1e-3b5d-4c0a-9a41-0d1f5e7b2a03
name: fd_markdown_image_exfil
status: experimental
description: >
  The response contains a markdown image whose query string carries a long
  opaque value. A chat client that renders it leaks that value to the image
  host with no click.
logsource: { product: ai_agent, category: genai_span }
detection:
  selection:
    gen_ai.operation.name: chat
    gen_ai.output.messages|re: '!\[[^\]]*\]\(https?://[^)\s]+\?[^)\s]*=[A-Za-z0-9+/=_%-]{24,}'
  condition: selection
level: high
tags:
  - owasp-asi.asi01
  - atlas.aml.t0077
