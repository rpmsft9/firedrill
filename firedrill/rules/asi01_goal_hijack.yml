title: Lethal trifecta - untrusted content, then secret read, then external egress
id: 6f0c8a1e-3b5d-4c0a-9a41-0d1f5e7b2a01
name: fd_lethal_trifecta
status: experimental
description: >
  Within one conversation the agent ingested untrusted content, then read a
  secret, then sent data outside the organisation, in that order. Behavioural:
  it does not depend on recognising the injected text.
correlation:
  type: temporal_ordered
  rules:
    - fd_base_untrusted_ingest
    - fd_base_sensitive_read
    - fd_base_external_egress
  group-by:
    - gen_ai.conversation.id
  timespan: 10m
level: critical
tags:
  - owasp-asi.asi01
  - owasp-asi.asi02
  - atlas.aml.t0051.001
  - atlas.aml.t0086
