title: Agent piped downloaded or decoded content into an interpreter
id: 6f0c8a1e-3b5d-4c0a-9a41-0d1f5e7b2a10
name: fd_download_and_execute
status: experimental
description: curl or wget piped to a shell, base64 decoded into a shell, or an encoded interpreter one-liner.
logsource: { product: ai_agent, category: genai_span }
detection:
  selection:
    gen_ai.operation.name: execute_tool
    gen_ai.tool.call.arguments|re|i: '(\b(curl|wget)\b[^|;&]*\|\s*(sudo\s+)?(ba|z|da|k)?sh\b|\bbase64\s+(-d|--decode)[^|]*\|\s*(sudo\s+)?(ba|z)?sh\b|\bpython[0-9.]*\s+-c\s.{0,60}exec\(.{0,60}b64decode|\bpowershell[^|;&]*\s-enc(odedcommand)?\s|\biex\s*\(\s*(new-object|iwr|invoke-webrequest))'
  condition: selection
level: critical
tags:
  - owasp-asi.asi05
  - atlas.aml.t0050
