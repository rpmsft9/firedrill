title: Agent opened a reverse shell
id: 6f0c8a1e-3b5d-4c0a-9a41-0d1f5e7b2a11
name: fd_reverse_shell
status: experimental
description: A command that binds an interactive shell to a network socket.
logsource: { product: ai_agent, category: genai_span }
detection:
  selection:
    gen_ai.operation.name: execute_tool
    gen_ai.tool.call.arguments|re|i: '(/dev/tcp/\d{1,3}(\.\d{1,3}){3}/\d+|\bnc(at)?\b[^|;&]*\s-[a-z]*e\s+/bin/(ba)?sh|\bsocat\b[^|;&]*exec:|\bbash\s+-i\s+>&)'
  condition: selection
level: critical
tags:
  - owasp-asi.asi05
  - atlas.aml.t0072
